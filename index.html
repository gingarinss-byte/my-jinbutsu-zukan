
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My人物図鑑＆住所録</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fff8f1;
      text-align: center;
      padding: 35px 15px;
    }
    .panel {
      background: white;
      max-width: 420px;
      margin: 30px auto;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 3px 12px #ddd;
    }
    h1 { color: #d66b30; }
    button {
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px 25px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>🌸 My人物図鑑＆住所録</h1>
    <p>あなただけの人物図鑑</p>
    <p>🔐 Googleアカウントでログイン</p>
    <button id="loginBtn" type="button">Googleでログイン</button>
    <p>安全なログイン機能を設定しています。</p>
  </div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAmHbKG-NJwquR0g7HXbuWH0y3goKjtIMw",
    authDomain: "my-jinbutsu-zukan.firebaseapp.com",
    projectId: "my-jinbutsu-zukan",
    storageBucket: "my-jinbutsu-zukan.firebasestorage.app",
    messagingSenderId: "593269991251",
    appId: "1:593269991251:web:308d2ba239bbdbfb9723a6"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

const provider = new GoogleAuthProvider();

document.getElementById("loginBtn").addEventListener("click", async () => {
  try {
    const result = await signInWithPopup(auth, provider);
    alert("ログインできました！");
  } catch (error) {
    console.error(error);
    alert("ログインに失敗しました: " + error.code);
  }
});
</script>
</body>
  
</html>
